name: Sync main back into development

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency: sync-main-to-development

jobs:
  merge-back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Merge main into development
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "development already contains main's tip; nothing to do."
            exit 0
          fi

          # Brings back commits that reached main without going through
          # development, namely make promote-content (see AGENTS.md), which
          # opens its PR directly against main. After a development->main
          # sync PR, this resolves as a fast-forward (development's prior tip
          # is already a parent of main's new tip). After a promote-content
          # merge, it's a real two-parent merge carrying that commit's actual
          # diff, since it never came from development.
          git merge --no-edit origin/main
          git push origin development
