name: Promote Content

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Content export release tag to promote to production (e.g. content-2026-08-06)"
        required: true
      description:
        description: "What changed, in a few words (becomes the PR title and production commit message)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify release exists
        run: gh release view "${{ inputs.tag }}" --repo mmserran/mserrano.dev-web-services
        env:
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}

      - name: Bump pinned content version
        run: echo "${{ inputs.tag }}" > CONTENT_VERSION

      - name: Open promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="promote-content/${{ inputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "${{ inputs.description }}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "${{ inputs.description }}" \
            --body "Promotes content export \`${{ inputs.tag }}\` to production."
